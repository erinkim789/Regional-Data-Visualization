<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Regional Development Data Visualization</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>

<body>

    <div class="container">
        <h1>How do the <select id="regionSelect">
                            <option value="Americas" selected>Americas</option>
                            <option value="East Asia & Pacific">East Asia & Pacific</option>
                            <option value="Europe & Central Asia">Europe & Central Asia</option>
                            <option value="Middle East & North Africa">Middle East & North Africa</option>
                            <option value="South Asia">South Asia</option>
                            <option value="Sub-Saharan Africa">Sub-Saharan Africa</option>
                        </select>
            on average compare to the other Regions across 10 metrics?</h1>
        <p>Please keep in mind that these averages are only taken from the most current year.</p>

        <div id="vis"></div>

        <div id="tooltip">
            <div id="tooltip-title">Region Info</div>

            <div class="tooltip-rows">
                <div class="tooltip-row">
                    <strong>METRIC:</strong> <span id="tooltip-metric"></span>
                </div>

                <div class="tooltip-row">
                    <strong>REGION:</strong> <span id="tooltip-region"></span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Load D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
